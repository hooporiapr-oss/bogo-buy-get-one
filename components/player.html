<div class="wrap">
  <h2>Player</h2>
  <div class="panel">
    <h3>Player Dashboard</h3>
    
    <label>Player Name</label>
    <input type="text" id="playerName" placeholder="Enter your name">
    
    <label>Campaign Code</label>
    <input type="text" id="campaignCode" placeholder="Enter campaign code">
    
    <button class="btn" onclick="joinCampaign()">Join Campaign</button>
    
    <div id="playerStats" style="display:none;margin-top:20px;">
      <h3>Your Stats</h3>
      <div class="panel" style="background:#ffffff08;margin-top:10px;padding:15px;">
        <p><strong>Points:</strong> 0</p>
        <p><strong>Rank:</strong> Pending</p>
        <p><strong>Status:</strong> Active</p>
      </div>
    </div>
  </div>
</div>

<script>
function joinCampaign() {
  const name = document.getElementById('playerName').value;
  const code = document.getElementById('campaignCode').value;
  if (name && code) {
    document.getElementById('playerStats').style.display = 'block';
    alert('Welcome, ' + name + '!');
  }
}
</script>
