<div class="wrap">
  <h2 data-i18n="tabCoach">Coach</h2>

  <div id="coachLocked" class="panel">
    <h3 data-i18n="coachSignIn">Coach Sign In</h3>
    <p data-i18n="coachSignInBody">Enter the email your campaign was set up with.</p>

    <label data-i18n="emailLabel">Email</label>
    <input type="email" id="coachEmailInput" data-i18n-ph="emailPh" placeholder="you@example.com" autocomplete="email">

    <button class="btn" onclick="sendMagicLink('coachEmailInput','coachAuthStatus')" style="margin-top:12px;" data-i18n="sendLink">Send sign-in link</button>

    <p id="coachAuthStatus" style="margin:14px 0 0 0;font-size:13px;color:#aaa;"></p>

    <div id="coachPicker" style="display:none;margin-top:16px;"></div>
  </div>

  <div id="coachUnlockedContent" style="display:none;">
    <div class="panel" style="margin-bottom:16px;">
      <h3 id="campaignNameDisplay" style="margin:0;">—</h3>
    </div>

    <div id="coachEarnings" style="margin-bottom:18px;"></div>

    <div class="panel">
      <h3 data-i18n="playersTitle">Roster</h3>

      <label data-i18n="playerNameLabel">Player Name</label>
      <input type="text" id="playerName" data-i18n-ph="playerNamePh" placeholder="Full name">

      <button class="btn" onclick="addPlayer()" style="margin-top:12px;" data-i18n="addPlayerBtn">Add Player</button>

      <div id="playersList" style="margin-top:18px;"></div>
    </div>

    <button class="btn red" onclick="coachLogout()" style="margin-top:20px;width:100%;" data-i18n="logout">Logout</button>
  </div>
</div>
