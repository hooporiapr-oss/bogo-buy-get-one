<div class="wrap">
  <h2>Coach Panel</h2>
  
  <div id="coachLocked" class="panel">
    <h3>Coach Access</h3>
    <p>Enter your coach access code to unlock player management.</p>
    
    <label>Coach Access Code</label>
    <input type="text" id="coachCode" placeholder="Enter your coach access code">
    
    <button class="btn" onclick="unlockCoach()">Unlock Coach Panel</button>
  </div>
  
  <div id="coachUnlockedContent" style="display:none;">
    <div class="panel">
      <h3>Campaign: <span id="campaignNameDisplay">-</span></h3>
      
      <div style="margin-top:20px;">
        <h4>Add Players</h4>
        <label>Player Name</label>
        <input type="text" id="playerName" placeholder="Enter player name">
        
        <button class="btn" onclick="addPlayer()" style="margin-top:12px;">Add Player</button>
      </div>
      
      <div style="margin-top:30px;">
        <h4>Players on Team</h4>
        <div id="playersList" style="margin-top:12px;">No players yet</div>
      </div>
      
      <button class="btn" onclick="createCards()" style="margin-top:20px;width:100%;">Create Cards for Players</button>
    </div>
  </div>
</div>
