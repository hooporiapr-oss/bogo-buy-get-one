<div class="wrap">
  <h2>Merchant</h2>
  <div class="panel">
    <h3>Redeem Cards</h3>
    <p>View and redeem cards that have been peeled by supporters.</p>
    
    <div id="merchantCardList" style="margin-top:20px;">
      <!-- Redeemable cards will load here -->
    </div>
    
    <div style="margin-top:30px;padding:15px;background:#ffffff08;border-radius:12px;border:1px solid #ffffff14;">
      <p style="margin:0;font-size:12px;color:#aaa;">📊 Redemption Status:</p>
      <p style="margin:8px 0 0 0;font-size:13px;">Only cards that have been peeled by supporters appear here. Click "Redeem" to mark them as claimed.</p>
    </div>
  </div>
</div>

<script>
// Load cards when this component appears
window.addEventListener('tabChanged', function(e) {
  if (e.detail.tab === 'merchant') {
    setTimeout(loadMerchantCards, 100);
  }
});

// Also load on initial load
setTimeout(loadMerchantCards, 500);
</script>
