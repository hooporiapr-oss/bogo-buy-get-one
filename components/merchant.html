<div class="wrap">
  <h2 data-i18n="tabMerchant">Merchant</h2>

  <div id="merchantLocked" class="panel">
    <h3 data-i18n="merchantAccess">Merchant Access</h3>
    <p data-i18n="merchantAccessBody">Enter the code we gave your business.</p>

    <label data-i18n="merchantCodeLabel">Merchant Code</label>
    <input type="text" id="merchantCode" data-i18n-ph="merchantCodePh" placeholder="MERCH-XXXXXXXX">

    <button class="btn" onclick="unlockMerchant()" style="margin-top:12px;" data-i18n="unlock">Unlock</button>
  </div>

  <div id="merchantUnlockedContent" style="display:none;">
    <div class="panel" style="margin-bottom:16px;">
      <h3 id="merchantNameDisplay" style="margin:0;">—</h3>
    </div>

    <div id="merchantStats" style="margin-bottom:18px;"></div>

    <div class="panel">
      <h3 data-i18n="lookupTitle">Look up a card</h3>
      <p style="font-size:12px;color:#888;" data-i18n="lookupBody">Type the code from the customer's card to redeem from this device.</p>

      <input type="text" id="lookupCode" data-i18n-ph="lookupPh" placeholder="Card code" style="text-transform:uppercase;">
      <button class="btn" onclick="merchantLookup()" style="margin-top:12px;" data-i18n="lookupBtn">Find card</button>

      <div id="lookupResult" style="margin-top:16px;"></div>
    </div>
  </div>
</div>
