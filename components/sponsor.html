<div class="wrap">
  <h2>Sponsor</h2>
  <div class="panel">
    <h3>Sponsor Dashboard</h3>
    
    <div style="margin-top:20px;display:grid;grid-template-columns:1fr 1fr;gap:15px;">
      <div style="padding:14px;background:#ffffff08;border-radius:12px;border:1px solid #ffffff14;">
        <p style="margin:0;font-size:12px;color:#aaa;">Total Raised</p>
        <p style="margin:8px 0 0 0;font-size:28px;font-weight:950;color:var(--gold);" id="totalRaised">$0</p>
      </div>
      <div style="padding:14px;background:#ffffff08;border-radius:12px;border:1px solid #ffffff14;">
        <p style="margin:0;font-size:12px;color:#aaa;">Cards Redeemed</p>
        <p style="margin:8px 0 0 0;font-size:28px;font-weight:950;color:var(--gold);" id="cardsRedeemed">0</p>
      </div>
    </div>
    
    <div style="margin-top:30px;">
      <h4>Campaign Summary</h4>
      <div id="campaignSummary" style="padding:15px;background:#ffffff08;border-radius:12px;border:1px solid #ffffff14;margin-top:12px;">
        <p style="margin:0;color:#aaa;">No active campaign</p>
      </div>
    </div>
    
    <div style="margin-top:30px;">
      <label>Sponsor Message</label>
      <textarea id="sponsorMessage" placeholder="Leave a message of support for the team..." style="width:100%;padding:12px;border-radius:9px;border:1px solid #ffffff1d;background:#0e0a11;color:#fff;margin-top:6px;font-family:inherit;height:100px;"></textarea>
      
      <button class="btn" onclick="postMessage()" style="margin-top:12px;">Post Message</button>
    </div>
  </div>
</div>

<script>
function updateSponsorDash() {
  const campaigns = getCampaigns();
  if (campaigns.length === 0) return;
  
  const campaign = campaigns[campaigns.length - 1];
  const redeemedCards = campaign.cards.filter(c => c.status === 'redeemed');
  const totalValue = redeemedCards.reduce((sum, c) => sum + c.value, 0);
  
  document.getElementById('totalRaised').textContent = '$' + totalValue;
  document.getElementById('cardsRedeemed').textContent = redeemedCards.length;
  
  document.getElementById('campaignSummary').innerHTML = `
    <p style="margin:0;font-weight:950;">${campaign.name}</p>
    <p style="margin:8px 0 0 0;font-size:13px;color:#aaa;">Goal: $${campaign.goal}</p>
    <p style="margin:4px 0 0 0;font-size:13px;color:#aaa;">Players: ${campaign.players.length}</p>
  `;
}

function postMessage() {
  const msg = document.getElementById('sponsorMessage').value;
  if (msg) {
    alert('Message posted! Thank you for supporting the team.');
    document.getElementById('sponsorMessage').value = '';
  }
}

// Update on page load and when tab changes
window.addEventListener('tabChanged', function(e) {
  if (e.detail.tab === 'sponsor') {
    setTimeout(updateSponsorDash, 100);
  }
});

setTimeout(updateSponsorDash, 500);
</script>
