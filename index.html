<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Basketball Money — Unified Digital Peel Prototype</title>
  
  <!-- Shared Styles -->
  <link rel="stylesheet" href="css/shared.css">
  
  <!-- Tab switching script -->
  <script src="js/tabs.js"></script>
</head>
<body>
  <!-- Navigation -->
  <nav>
    <div class="wrap">
      <div class="navin">
        <div class="brand">
          <img src="bball-money.jpg" alt="Basketball Money" style="width:50px;height:50px;border-radius:10px;">
        </div>
        <div class="tabs">
          <button class="tab active" data-tab="admin">Admin</button>
          <button class="tab" data-tab="player">Player</button>
          <button class="tab" data-tab="supporter">Supporter</button>
          <button class="tab" data-tab="merchant">Merchant</button>
          <button class="tab" data-tab="sponsor">Sponsor</button>
          <button class="tab" data-tab="coach">Coach</button>
        </div>
      </div>
    </div>
  </nav>

  <!-- Hero Section -->
  <header>
    <div class="wrap">
      <div class="hero">
        <div>
          <div class="k">Basketball Money Platform</div>
          <h1>Raise Funds. Engage Fans. Win Together.</h1>
          <p>A complete digital fundraising system for basketball teams. Create campaigns, sell peelable digital cards, track engagement, and reach your goals.</p>
          
          <div style="display:flex;gap:12px;margin-top:24px;flex-wrap:wrap;">
            <button class="btn alt" onclick="showTab('supporter')">Support a Team</button>
          </div>
          
          <div style="margin-top:32px;display:grid;grid-template-columns:1fr 1fr;gap:20px;">
            <div style="padding:14px;background:#ffffff08;border-radius:12px;border:1px solid #ffffff14;">
              <p style="margin:0;font-size:12px;color:#aaa;">Total Raised</p>
              <p style="margin:6px 0 0 0;font-size:28px;font-weight:950;color:var(--gold);">$0</p>
            </div>
            <div style="padding:14px;background:#ffffff08;border-radius:12px;border:1px solid #ffffff14;">
              <p style="margin:0;font-size:12px;color:#aaa;">Active Campaigns</p>
              <p style="margin:6px 0 0 0;font-size:28px;font-weight:950;color:var(--gold);">0</p>
            </div>
          </div>
        </div>
        
        <div style="text-align:center;">
          <img src="bball-money.jpg" alt="Basketball Money" style="width:100%;border-radius:20px;box-shadow:0 25px 60px #0008;">
        </div>
      </div>
    </div>
  </header>

  <!-- Tab Content Containers -->
  <main>
    <section id="view-admin" class="view active"></section>
    <section id="view-player" class="view"></section>
    <section id="view-supporter" class="view"></section>
    <section id="view-merchant" class="view"></section>
    <section id="view-sponsor" class="view"></section>
    <section id="view-coach" class="view"></section>
  </main>

  <!-- Main app script -->
  <script>
    // SessionStorage-based app (no Supabase yet)

    if(sessionStorage.getItem('bm_admin_unlocked') === 'yes'){
      setTimeout(() => {
        const adminLocked = document.getElementById('adminLocked');
        const adminUnlocked = document.getElementById('adminUnlockedContent');
        if(adminLocked) adminLocked.style.display='none';
        if(adminUnlocked) adminUnlocked.style.display='block';
      }, 100);
    }

    // Storage helpers
    function getCampaigns() {
      return JSON.parse(sessionStorage.getItem('campaigns') || '[]');
    }

    function saveCampaigns(campaigns) {
      sessionStorage.setItem('campaigns', JSON.stringify(campaigns));
    }

    // Admin unlock
    function unlockAdmin() {
      const code = document.getElementById('adminCode').value;
      if (code === 'admin123') {
        sessionStorage.setItem('bm_admin_unlocked', 'yes');
        document.getElementById('adminLocked').style.display='none';
        document.getElementById('adminUnlockedContent').style.display='block';
      } else {
        alert('Invalid admin code');
      }
    }

    // Create campaign
    function createCampaign() {
      const name = document.getElementById('campaignName').value;
      const goal = document.getElementById('campaignGoal').value;
      const desc = document.getElementById('campaignDesc').value;
      
      if (!name || !goal) {
        alert('Please fill in all required fields');
        return;
      }
      
      const coachCode = 'COACH-' + Math.random().toString(36).substr(2, 9).toUpperCase();
      
      const campaign = {
        id: Date.now(),
        name,
        goal: parseFloat(goal),
        description: desc,
        coachCode,
        players: [],
        cards: [],
        createdAt: new Date().toISOString()
      };
      
      const campaigns = getCampaigns();
      campaigns.push(campaign);
      saveCampaigns(campaigns);
      
      document.getElementById('campaignName').value = '';
      document.getElementById('campaignGoal').value = '';
      document.getElementById('campaignDesc').value = '';
      document.getElementById('coachCode').textContent = coachCode;
      document.getElementById('campaignSuccess').style.display = 'block';
      
      alert('Campaign created! Coach code: ' + coachCode);
    }

    // Coach unlock
    function unlockCoach() {
      const code = document.getElementById('coachCode').value;
      const campaigns = getCampaigns();
      const campaign = campaigns.find(c => c.coachCode === code);
      
      if (campaign) {
        sessionStorage.setItem('currentCampaignId', campaign.id);
        document.getElementById('coachLocked').style.display = 'none';
        document.getElementById('coachUnlockedContent').style.display = 'block';
        loadCoachDashboard();
      } else {
        alert('Invalid coach code');
      }
    }

    // Load coach dashboard
    function loadCoachDashboard() {
      const campaignId = parseInt(sessionStorage.getItem('currentCampaignId'));
      const campaigns = getCampaigns();
      const campaign = campaigns.find(c => c.id === campaignId);
      
      if (!campaign) return;
      
      document.getElementById('campaignNameDisplay').textContent = campaign.name;
      
      const playersList = document.getElementById('playersList');
      playersList.innerHTML = campaign.players.map((p, i) => `
        <div style="padding:10px;background:#0e0a11;border-radius:9px;margin:5px 0;display:flex;justify-content:space-between;align-items:center;">
          <span>${p.name}</span>
          <button class="btn alt" onclick="removePlayer(${i})" style="padding:5px 10px;font-size:11px;">Remove</button>
        </div>
      `).join('');
    }

    // Add player
    function addPlayer() {
      const name = document.getElementById('playerName').value;
      if (!name) {
        alert('Enter player name');
        return;
      }
      
      const campaignId = parseInt(sessionStorage.getItem('currentCampaignId'));
      const campaigns = getCampaigns();
      const campaign = campaigns.find(c => c.id === campaignId);
      
      campaign.players.push({ name, id: Date.now() });
      saveCampaigns(campaigns);
      
      document.getElementById('playerName').value = '';
      loadCoachDashboard();
      alert('Player added!');
    }

    // Remove player
    function removePlayer(index) {
      const campaignId = parseInt(sessionStorage.getItem('currentCampaignId'));
      const campaigns = getCampaigns();
      const campaign = campaigns.find(c => c.id === campaignId);
      
      campaign.players.splice(index, 1);
      saveCampaigns(campaigns);
      loadCoachDashboard();
    }

    // Create cards for players
    function createCards() {
      const campaignId = parseInt(sessionStorage.getItem('currentCampaignId'));
      const campaigns = getCampaigns();
      const campaign = campaigns.find(c => c.id === campaignId);
      
      campaign.cards = [];
      campaign.players.forEach(player => {
        for (let i = 0; i < 8; i++) {
          campaign.cards.push({
            id: Date.now() + Math.random(),
            playerId: player.id,
            playerName: player.name,
            status: 'sealed',
            value: Math.floor(Math.random() * 50) + 1
          });
        }
      });
      
      saveCampaigns(campaigns);
      alert('Cards created for all players!');
    }

    // Load supporter cards
    function loadSupporterCards() {
      const campaigns = getCampaigns();
      if (campaigns.length === 0) {
        document.getElementById('cardGrid').innerHTML = '<p>No campaigns available</p>';
        return;
      }
      
      const campaign = campaigns[campaigns.length - 1];
      
      document.getElementById('cardGrid').innerHTML = campaign.cards.map(card => `
        <div class="card-item" style="padding:15px;background:linear-gradient(145deg,#2b1039,#0d0911);border:1px solid #ffffff1d;border-radius:15px;text-align:center;cursor:pointer;" onclick="peelCard('${card.id}')">
          <p style="margin:0;font-size:20px;">${card.status === 'sealed' ? '🔒' : '✓'}</p>
          <p style="margin:8px 0 0 0;font-size:12px;color:#aaa;">${card.playerName}</p>
          <p style="margin:4px 0 0 0;font-weight:950;color:var(--gold);" id="card-${card.id}">$${card.value}</p>
        </div>
      `).join('');
    }

    // Peel card
    function peelCard(cardId) {
      const campaigns = getCampaigns();
      const campaign = campaigns[campaigns.length - 1];
      const card = campaign.cards.find(c => c.id == cardId);
      
      if (card && card.status === 'sealed') {
        card.status = 'revealed';
        saveCampaigns(campaigns);
        loadSupporterCards();
        alert('You revealed: $' + card.value);
      }
    }

    // Load merchant cards for redemption
    function loadMerchantCards() {
      const campaigns = getCampaigns();
      if (campaigns.length === 0) return;
      
      const campaign = campaigns[campaigns.length - 1];
      const revealedCards = campaign.cards.filter(c => c.status === 'revealed');
      
      document.getElementById('merchantCardList').innerHTML = revealedCards.map(card => `
        <div style="padding:12px;background:#0e0a11;border-radius:9px;margin:8px 0;display:flex;justify-content:space-between;align-items:center;">
          <div>
            <p style="margin:0;font-weight:950;">${card.playerName}</p>
            <p style="margin:4px 0 0 0;font-size:12px;color:#aaa;">$${card.value}</p>
          </div>
          <button class="btn" onclick="redeemCard('${card.id}')" style="padding:8px 12px;font-size:11px;">Redeem</button>
        </div>
      `).join('');
    }

    // Redeem card
    function redeemCard(cardId) {
      const campaigns = getCampaigns();
      const campaign = campaigns[campaigns.length - 1];
      const card = campaign.cards.find(c => c.id == cardId);
      
      if (card) {
        card.status = 'redeemed';
        saveCampaigns(campaigns);
        loadMerchantCards();
        alert('Card redeemed: $' + card.value);
      }
    }
  </script>
</body>
</html>
