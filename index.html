<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Basketball Money</title>

  <link rel="stylesheet" href="css/shared.css">
  <script src="js/tabs.js"></script>

  <style>
    main { padding-top:22px; }

    /* Hamburger nav — overrides shared.css for the nav area only */
    .navin { display:flex; align-items:center; justify-content:space-between; gap:12px; position:relative; }

    .brandtext {
      font-weight:950; letter-spacing:.5px; font-size:16px; line-height:1.1;
      color:#fff; text-decoration:none; text-transform:uppercase; white-space:nowrap;
    }
    .brandtext span { color:var(--gold, #f5c542); }

    .navright { display:flex; align-items:center; gap:8px; }

    .hamburger {
      display:flex; flex-direction:column; justify-content:center; gap:5px;
      width:42px; height:38px; padding:9px 10px; cursor:pointer;
      background:#ffffff10; border:1px solid #ffffff2a; border-radius:9px;
    }
    .hamburger span {
      display:block; height:2px; width:100%; background:#fff; border-radius:2px;
      transition:transform .2s ease, opacity .2s ease;
    }
    .hamburger.open span:nth-child(1) { transform:translateY(7px) rotate(45deg); }
    .hamburger.open span:nth-child(2) { opacity:0; }
    .hamburger.open span:nth-child(3) { transform:translateY(-7px) rotate(-45deg); }

    #navMenu {
      display:none; position:absolute; top:calc(100% + 10px); right:0; z-index:60;
      min-width:210px; padding:8px;
      background:#150f1b; border:1px solid #ffffff1f; border-radius:14px;
      box-shadow:0 18px 44px #000a;
    }
    #navMenu.open { display:block; }

    #navMenu .tab {
      display:block; width:100%; text-align:left; margin:2px 0;
      padding:12px 14px; font-size:14px; font-weight:700;
      background:transparent; border:none; border-radius:9px;
      color:#e9e4ee; cursor:pointer;
    }
    #navMenu .tab:hover { background:#ffffff12; }
    #navMenu .tab.active { background:#5b2377; color:#fff; }

    #langToggle {
      padding:9px 13px; border-radius:9px; border:1px solid #ffffff2a;
      background:#ffffff10; color:#fff; cursor:pointer; font-size:12px; font-weight:800;
    }
  </style>
</head>
<body>
  <nav>
    <div class="wrap">
      <div class="navin">
        <a href="index.html" class="brandtext">Basketball <span>Money</span></a>

        <div class="navright">
          <button id="langToggle" onclick="toggleLang()">ES</button>

          <div class="hamburger" id="hamburger" onclick="toggleNav()" aria-label="Menu" role="button" tabindex="0">
            <span></span><span></span><span></span>
          </div>
        </div>

        <div id="navMenu" class="tabs">
          <button class="tab active" data-tab="admin" data-i18n="tabAdmin">Admin</button>
          <button class="tab" data-tab="coach" data-i18n="tabCoach">Coach</button>
          <button class="tab" data-tab="merchant" data-i18n="tabMerchant">Merchant</button>
          <button class="tab" data-tab="sponsor" data-i18n="tabSponsor">Sponsor</button>
        </div>
      </div>
    </div>
  </nav>



  <main>
    <section id="view-admin" class="view active">
      <div class="wrap">
        <h2 data-i18n="adminPanel">Admin Panel</h2>

        <div id="adminLoginScreen" class="panel">
          <h3 data-i18n="adminLogin">Admin Login</h3>
          <p data-i18n="adminLoginBody">Enter your email and we'll send you a sign-in link.</p>

          <div id="adminSignInForm">
            <label data-i18n="emailLabel">Email</label>
            <input type="email" id="adminEmail" data-i18n-ph="emailPh" placeholder="you@example.com" autocomplete="email">

            <button class="btn" onclick="sendMagicLink('adminEmail','authStatus')" style="margin-top:12px;" data-i18n="sendLink">Send sign-in link</button>
          </div>

          <p id="authStatus" style="margin:14px 0 0 0;font-size:13px;color:#aaa;"></p>
        </div>

        <div id="adminDashboard" style="display:none;">
          <p id="adminWhoami" style="margin:0 0 16px 0;font-size:12px;color:#888;"></p>

          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
            <h3 style="margin:0;" data-i18n="merchants">Merchants</h3>
            <button class="btn" onclick="toggleForm('createMerchantForm')" data-i18n="newMerchant">+ New Merchant</button>
          </div>

          <div id="createMerchantForm" class="panel" style="display:none;margin-bottom:20px;">
            <h3 data-i18n="addMerchant">Add Merchant</h3>

            <label data-i18n="businessName">Business Name</label>
            <input type="text" id="merchantName" data-i18n-ph="businessNamePh" placeholder="e.g. Domino's Pizza">

            <label data-i18n="logoUrl">Logo URL (optional)</label>
            <input type="text" id="merchantLogo" placeholder="https://...">

            <label data-i18n="contactName">Contact Name (optional)</label>
            <input type="text" id="merchantContact" data-i18n-ph="contactNamePh" placeholder="Contact person">

            <label data-i18n="contactEmail">Contact Email (optional)</label>
            <input type="text" id="merchantEmail" placeholder="name@business.com">

            <div style="display:flex;gap:10px;margin-top:12px;">
              <button class="btn" onclick="createMerchant()" data-i18n="saveMerchant">Save Merchant</button>
              <button class="btn alt" onclick="toggleForm('createMerchantForm')" data-i18n="cancel">Cancel</button>
            </div>
          </div>

          <div class="panel" style="margin-bottom:26px;">
            <div id="merchantsContainer">—</div>
          </div>

          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
            <h3 style="margin:0;" data-i18n="bogoCards">BOGO Cards</h3>
            <button class="btn" onclick="toggleForm('createDesignForm')" data-i18n="newCard">+ New Card</button>
          </div>

          <div id="createDesignForm" class="panel" style="display:none;margin-bottom:20px;">
            <h3 data-i18n="createBogoCard">Create BOGO Card</h3>

            <label data-i18n="merchant">Merchant</label>
            <select id="designMerchant" style="width:100%;padding:12px;border-radius:9px;border:1px solid #ffffff1d;background:#0e0a11;color:#fff;margin-top:6px;font-family:inherit;">
              <option value="" data-i18n="selectMerchantOpt">Select a merchant...</option>
            </select>

            <label data-i18n="cardName">Card Name</label>
            <input type="text" id="designName" data-i18n-ph="cardNamePh" placeholder="e.g. Domino's 16-Tab BOGO">

            <label data-i18n="numTabs">Number of Coupon Tabs</label>
            <select id="designTabs" style="width:100%;padding:12px;border-radius:9px;border:1px solid #ffffff1d;background:#0e0a11;color:#fff;margin-top:6px;font-family:inherit;">
              <option value="8" data-i18n="tabs8">8 tabs</option>
              <option value="16" selected data-i18n="tabs16">16 tabs</option>
              <option value="32" data-i18n="tabs32">32 tabs</option>
            </select>

            <label data-i18n="price">Price ($)</label>
            <input type="number" id="designPrice" value="20" step="0.01">

            <label data-i18n="teamSharePct">Team Share (%)</label>
            <input type="number" id="designShare" value="50" min="0" max="100">
            <p style="margin:6px 0 0 0;font-size:11px;color:#888;" id="splitPreview"></p>

            <label data-i18n="offerText">Offer Text</label>
            <input type="text" id="designOffer" value="Buy One Get One Free">

            <label data-i18n="terms">Terms (optional)</label>
            <input type="text" id="designTerms" data-i18n-ph="termsPh" placeholder="One per visit. Not valid with other offers.">

            <label data-i18n="expiresOn">Expires On (optional)</label>
            <input type="date" id="designExpires">

            <div style="display:flex;gap:10px;margin-top:12px;">
              <button class="btn" onclick="createDesign()" data-i18n="createCardBtn">Create Card</button>
              <button class="btn alt" onclick="toggleForm('createDesignForm')" data-i18n="cancel">Cancel</button>
            </div>
          </div>

          <div class="panel" style="margin-bottom:26px;">
            <div id="designsContainer">—</div>
          </div>

          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
            <h3 style="margin:0;" data-i18n="payouts">Payouts</h3>
          </div>

          <div class="panel" style="margin-bottom:26px;">
            <div id="payoutsContainer">—</div>
          </div>

          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
            <h3 style="margin:0;" data-i18n="campaigns">Campaigns</h3>
            <button class="btn" onclick="toggleForm('createCampaignForm')" data-i18n="newCampaign">+ New Campaign</button>
          </div>

          <div id="createCampaignForm" class="panel" style="display:none;margin-bottom:20px;">
            <h3 data-i18n="createCampaignTitle">Create New Campaign</h3>

            <label data-i18n="campaignName">Campaign Name</label>
            <input type="text" id="campaignName" data-i18n-ph="campaignNamePh" placeholder="Enter campaign name">

            <label data-i18n="campaignGoal">Campaign Goal ($)</label>
            <input type="number" id="campaignGoal" data-i18n-ph="campaignGoalPh" placeholder="Enter goal amount">

            <label data-i18n="description">Description</label>
            <textarea id="campaignDesc" data-i18n-ph="descriptionPh" placeholder="Campaign description" style="width:100%;padding:12px;border-radius:9px;border:1px solid #ffffff1d;background:#0e0a11;color:#fff;margin-top:6px;font-family:inherit;height:80px;"></textarea>

            <div style="display:flex;gap:10px;margin-top:12px;">
              <button class="btn" onclick="createCampaign()" data-i18n="createCampaignBtn">Create Campaign</button>
              <button class="btn alt" onclick="toggleForm('createCampaignForm')" data-i18n="cancel">Cancel</button>
            </div>
          </div>

          <div id="campaignsList" class="panel">
            <div id="campaignsContainer" style="margin-top:4px;">—</div>
          </div>

          <button class="btn red" onclick="adminLogout()" style="margin-top:20px;width:100%;" data-i18n="logout">Logout</button>
        </div>
      </div>
    </section>

    <section id="view-team" class="view"></section>
    <section id="view-player" class="view"></section>
    <section id="view-supporter" class="view"></section>
    <section id="view-merchant" class="view"></section>
    <section id="view-sponsor" class="view"></section>
    <section id="view-coach" class="view"></section>
  </main>

    // ===== AUTH (magic link) =====
    // Tokens live in localStorage. When one is present every database
    // call is made AS that signed-in user, so the database can tell
    // who is asking. With no token we fall back to the anonymous key,
    // which is what supporters and players use.

    const AUTH = {
      get() {
        try { return JSON.parse(localStorage.getItem('bm_session') || 'null'); }
        catch (e) { return null; }
      },
      set(sess) {
        if (!sess) { localStorage.removeItem('bm_session'); return; }
        sess.expires_at = Date.now() + ((sess.expires_in || 3600) * 1000) - 60000;
        localStorage.setItem('bm_session', JSON.stringify(sess));
      },
      clear() { localStorage.removeItem('bm_session'); }
    };

    // Access tokens last about an hour. Swap an expired one for a
    // fresh token rather than making the user sign in again.
    async function currentToken() {
      const sess = AUTH.get();
      if (!sess) return null;
      if (sess.expires_at && Date.now() < sess.expires_at) return sess.access_token;

      try {
        const res = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=refresh_token`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_KEY },
          body: JSON.stringify({ refresh_token: sess.refresh_token })
        });
        if (!res.ok) { AUTH.clear(); return null; }
        const fresh = await res.json();
        AUTH.set(fresh);
        return fresh.access_token;
      } catch (e) {
        AUTH.clear();
        return null;
      }
    }

    // The signed-in email, read straight from the token.
    function signedInEmail() {
      const sess = AUTH.get();
      if (!sess || !sess.access_token) return null;
      try {
        const payload = JSON.parse(atob(sess.access_token.split('.')[1]));
        return payload.email || null;
      } catch (e) {
        return null;
      }
    }

    }

    async function sendMagicLink(emailFieldId, statusId, role) {
      const email = (document.getElementById(emailFieldId || 'adminEmail').value || '').trim();
      const status = document.getElementById(statusId || 'authStatus');
      if (!email) { alert(t('enterEmail')); return; }

      status.textContent = t('sending');

      try {
        // Carry the tab they started from, so the link brings them
        // back to the right screen instead of the default one.
        const redirect = window.location.origin + window.location.pathname +
          (role ? '?signin=' + role : '');
        const res = await fetch(`${SUPABASE_URL}/auth/v1/otp?redirect_to=${encodeURIComponent(redirect)}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_KEY },
          body: JSON.stringify({ email, create_user: true })
        });
        if (!res.ok) {
          // Supabase refuses for a few predictable reasons. Say which,
          // rather than claiming an email is on its way when it isn't.
          let detail = '';
          try { detail = (await res.json()).msg || (await res.text()) || ''; }
          catch (e) { detail = ''; }

          if (res.status === 429) {
            status.textContent = t('tooManyRequests');
          } else if (res.status === 422 || /signup|not allowed|disabled/i.test(detail)) {
            status.textContent = t('signupsClosed');
          } else {
            status.textContent = t('linkFailed') + ' ' + (detail || res.status);
          }
          console.error('Magic link refused:', res.status, detail);
          return;
        }

        status.textContent = t('linkSent');
      } catch (error) {
        // Network-level failure: the request never reached Supabase.
        console.error('Magic link:', error);
        status.textContent = t('linkNetwork');
      }
    }

    // Supabase puts the tokens in the URL fragment after sign-in.
    function captureSessionFromUrl() {
      if (!window.location.hash || window.location.hash.indexOf('access_token') === -1) return false;
      const h = new URLSearchParams(window.location.hash.substring(1));
      const access_token = h.get('access_token');
      if (!access_token) return false;

      AUTH.set({
        access_token,
        refresh_token: h.get('refresh_token'),
        expires_in: parseInt(h.get('expires_in'), 10) || 3600
      });

      // Strip the tokens out of the address bar.
      history.replaceState(null, '', window.location.pathname + window.location.search);
      return true;
    }

    // Asks the database whether the signed-in email is on the admin list.
    async function checkIsAdmin() {
      const token = await currentToken();
      if (!token) return false;
      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/is_admin`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'apikey': SUPABASE_KEY,
            'Authorization': `Bearer ${token}`
          },
          body: '{}'
        });
        if (!res.ok) return false;
        return (await res.json()) === true;
      } catch (e) {
        console.error('Admin check:', e);
        return false;
      }
    }

    // Supabase helper
    async function supabaseQuery(table, method = 'GET', data = null, filter = '') {
      const url = `${SUPABASE_URL}/rest/v1/${table}${filter}`;
      const token = await currentToken();
      const options = {
        method,
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${token || SUPABASE_KEY}`,
          'apikey': SUPABASE_KEY,
          'Prefer': 'return=representation'
        }
      };
      if (data) options.body = JSON.stringify(data);
      
      const response = await fetch(url, options);
      if (!response.ok) {
        const errText = await response.text();
        throw new Error(`Supabase error: ${response.status} ${errText}`);
      }
      
      const contentType = response.headers.get('content-type');
      if (contentType && contentType.includes('application/json')) {
        return await response.json();
      }
      return null;
    }

    // ===== CAMPAIGNS =====

    async function createCampaign() {
      const name = document.getElementById('campaignName').value;
      const goal = document.getElementById('campaignGoal').value;
      const desc = document.getElementById('campaignDesc').value;
      
      if (!name || !goal) {
        alert(t('fillFields'));
        return;
      }
      
      try {
        const coachCode = 'COACH-' + Math.random().toString(36).substr(2, 9).toUpperCase();
        const adminCode = 'ADMIN-' + Math.random().toString(36).substr(2, 9).toUpperCase();
        
        const slug = name.toLowerCase().trim()
          .replace(/[^a-z0-9]+/g, '-')
          .replace(/^-+|-+$/g, '') + '-' + Math.random().toString(36).substr(2, 4);

        const campaign = await supabaseQuery('campaigns', 'POST', {
          name,
          goal: parseFloat(goal),
          description: desc,
          admin_code: adminCode,
          slug
        }, '?select=*');
        
        if (!campaign || !Array.isArray(campaign) || campaign.length === 0) {
          throw new Error('No response from Supabase');
        }
        
        await supabaseQuery('coaches', 'POST', {
          campaign_id: campaign[0].id,
          name: 'Head Coach',
          access_code: coachCode
        }, '?select=*');
        
        document.getElementById('campaignName').value = '';
        document.getElementById('campaignGoal').value = '';
        document.getElementById('campaignDesc').value = '';
        document.getElementById('createCampaignForm').style.display = 'none';
        
        alert('Campaign created!\nCoach Code: ' + coachCode);
        loadCampaigns();
      } catch (error) {
        console.error('Error:', error);
        alert('Error: ' + error.message);
      }
    }

      try {

        if (!campaigns || campaigns.length === 0) {

          const coachId = coaches && coaches.length > 0 ? coaches[0].id : '';
          
          html += `
            <div style="padding:14px;background:#0e0a11;border-radius:9px;margin:10px 0;border:1px solid #ffffff14;">
              <div style="display:flex;justify-content:space-between;align-items:start;gap:10px;">
                <div style="flex:1;">
                  <p style="margin:0;font-weight:950;font-size:16px;">${c.name}</p>
                  <p style="margin:4px 0 0 0;font-size:12px;color:#aaa;">${t('goal')}: $${c.goal}</p>
                  <p style="margin:4px 0 0 0;font-size:12px;color:#888;">${c.description || t('noDescription')}</p>

    // ===== PAYOUTS =====

    async function loadPayouts() {
      const box = document.getElementById('payoutsContainer');
      if (!box) return;

      try {
        const campaigns = await supabaseQuery('campaigns', 'GET', null, '?select=id,name&order=created_at.desc');
        if (!campaigns || campaigns.length === 0) {
          box.innerHTML = `<p style="color:#aaa;">${t('noCampaigns')}</p>`;
          return;
        }

        // one read each, then totalled per campaign in the browser
        const cards = await supabaseQuery('cards', 'GET', null, '?select=campaign_id,team_amount,platform_amount');
        const paid = await supabaseQuery('payouts', 'GET', null, '?select=campaign_id,amount');

        const owedBy = {}, platformBy = {}, paidBy = {};
        (cards || []).forEach(c => {
          owedBy[c.campaign_id] = (owedBy[c.campaign_id] || 0) + Number(c.team_amount || 0);
          platformBy[c.campaign_id] = (platformBy[c.campaign_id] || 0) + Number(c.platform_amount || 0);
        });
        (paid || []).forEach(p => {
          paidBy[p.campaign_id] = (paidBy[p.campaign_id] || 0) + Number(p.amount || 0);
        });

        let totalOwed = 0, totalPaid = 0, totalPlatform = 0;

        const rows = campaigns.map(c => {
          const owed = owedBy[c.id] || 0;
          const already = paidBy[c.id] || 0;
          const outstanding = owed - already;
          totalOwed += owed; totalPaid += already; totalPlatform += platformBy[c.id] || 0;

          return `
            <div style="padding:14px;background:#0e0a11;border-radius:9px;margin:10px 0;border:1px solid #ffffff14;">
              <div style="display:flex;justify-content:space-between;align-items:start;gap:10px;">
                <div style="flex:1;">
                  <p style="margin:0;font-weight:950;font-size:15px;">${c.name}</p>
                  <p style="margin:6px 0 0 0;font-size:12px;color:#aaa;">
                    ${t('teamShareTotal')}: <strong style="color:#fff;">${money(owed)}</strong> ·
                    ${t('paidOut')}: <strong style="color:#fff;">${money(already)}</strong>
                  </p>
                  <p style="margin:6px 0 0 0;font-size:15px;font-weight:950;color:${outstanding > 0.005 ? 'var(--gold)' : '#6f6'};">
                    ${t('outstanding')}: ${money(outstanding)}
                  </p>
                </div>
                <div style="display:flex;flex-direction:column;gap:6px;flex-shrink:0;">
                  <button class="btn" onclick="recordPayout('${c.id}', ${outstanding.toFixed(2)})" style="padding:6px 10px;font-size:11px;">${t('recordPayment')}</button>
                  <button class="btn alt" onclick="viewPayoutHistory('${c.id}', '${String(c.name).replace(/'/g, "\\'")}')" style="padding:6px 10px;font-size:11px;">${t('history')}</button>
                </div>
              </div>
              <div id="payoutHistory-${c.id}" style="display:none;margin-top:10px;"></div>
            </div>`;
        }).join('');

        box.innerHTML = `
          <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:16px;">
            <div style="padding:14px;background:#ffffff08;border-radius:12px;border:1px solid #ffffff14;">
              <p style="margin:0;font-size:12px;color:#aaa;">${t('owedToTeams')}</p>
              <p style="margin:6px 0 0 0;font-size:24px;font-weight:950;color:var(--gold);">${money(totalOwed - totalPaid)}</p>
            </div>
            <div style="padding:14px;background:#ffffff08;border-radius:12px;border:1px solid #ffffff14;">
              <p style="margin:0;font-size:12px;color:#aaa;">${t('paidToDate')}</p>
              <p style="margin:6px 0 0 0;font-size:24px;font-weight:950;">${money(totalPaid)}</p>
            </div>
            <div style="padding:14px;background:#ffffff08;border-radius:12px;border:1px solid #ffffff14;">
              <p style="margin:0;font-size:12px;color:#aaa;">${t('platformShare')}</p>
              <p style="margin:6px 0 0 0;font-size:24px;font-weight:950;">${money(totalPlatform)}</p>
            </div>
          </div>
          ${rows}`;
      } catch (error) {
        console.error('Payouts:', error);
        box.innerHTML = '<p style="color:#f66;">Error: ' + error.message + '</p>';
      }
    }

    async function recordPayout(campaignId, suggested) {
      const amountRaw = prompt(t('payoutAmount'), Number(suggested || 0).toFixed(2));
      if (amountRaw === null) return;
      const amount = parseFloat(amountRaw);
      if (!amount || amount <= 0) { alert(t('badAmount')); return; }

      const method = prompt(t('payoutMethod'), '');
      if (method === null) return;

      const reference = prompt(t('payoutReference'), '');
      if (reference === null) return;

      try {
        await supabaseQuery('payouts', 'POST', {
          campaign_id: campaignId,
          amount,
          method: method || null,
          reference: reference || null
        }, '?select=*');
        loadPayouts();
        alert(t('payoutRecorded'));
      } catch (error) {
        console.error('Payout:', error);
        alert('Error: ' + error.message);
      }
    }

      const box = document.getElementById('payoutHistory-' + campaignId);
      if (!box) return;

      if (box.style.display === 'block') { box.style.display = 'none'; return; }
      box.style.display = 'block';
      box.innerHTML = `<p style="color:#aaa;font-size:12px;">${t('loading')}</p>`;

      try {
        const rows = await supabaseQuery('payouts', 'GET', null,
          `?campaign_id=eq.${campaignId}&order=paid_on.desc`);

        if (!rows || rows.length === 0) {
          box.innerHTML = `<p style="color:#888;font-size:12px;">${t('noPayouts')}</p>`;

              <strong style="color:var(--gold);">${money(r.amount)}</strong>

    async function deletePayout(id) {
      if (!confirm(t('confirmDeletePayout'))) return;
      try {
        await supabaseQuery(`payouts?id=eq.${id}`, 'DELETE');
        loadPayouts();
      } catch (error) {
        alert('Error: ' + error.message);
      }

    // ===== COACH =====

    // A signed-in coach sees only their own campaign — the database
    // returns nothing for anyone else, so there is no code to leak.
    async function initCoach() {
      if (!AUTH.get()) return;

      whenReady('coachLocked', async () => {
        try {
          const coaches = await supabaseQuery('coaches', 'GET', null, '?select=id,campaign_id,name,email');
          const mine = (coaches || []).filter(c => c.email);

          if (mine.length === 0) {
            // Signed in fine, but this email coaches nothing. Say so,
            // otherwise the form just sits there and looks broken.
            const status = document.getElementById('coachAuthStatus');
            if (status) status.textContent = t('notACoach');
            return;
          }

          if (mine.length === 1) {
            openCoachCampaign(mine[0]);
            return;
          }

          // Coaches one person runs for more than one team.
          const box = document.getElementById('coachPicker');
          if (box) {
            box.innerHTML = `<p style="margin:0 0 8px 0;font-size:13px;color:#aaa;">${t('pickCampaign')}</p>` +
              mine.map(c => `<button class="btn alt" onclick='openCoachCampaign(${JSON.stringify(c)})' style="display:block;width:100%;margin:6px 0;">${c.name || t('tabCoach')}</button>`).join('');
            box.style.display = 'block';
          }
        } catch (error) {
          console.error('Coach init:', error);
        }
      });
    }

    function openCoachCampaign(coach) {
      showSignedInAs('coachWhoami');
      sessionStorage.setItem('currentCampaignId', coach.campaign_id);
      sessionStorage.setItem('currentCoachId', coach.id);
      document.getElementById('coachLocked').style.display = 'none';
      const picker = document.getElementById('coachPicker');
      if (picker) picker.style.display = 'none';
      document.getElementById('coachUnlockedContent').style.display = 'block';
      loadCoachDashboard();
    }

    async function coachLogout() {
      sessionStorage.removeItem('currentCampaignId');
      sessionStorage.removeItem('currentCoachId');
      await adminLogout();
      location.reload();
    }

    async function loadCoachDashboard() {
      try {
        const campaignId = sessionStorage.getItem('currentCampaignId');
        
        const campaigns = await supabaseQuery('campaigns', 'GET', null, `?id=eq.${campaignId}`);
        if (!campaigns || campaigns.length === 0) return;
        
        document.getElementById('campaignNameDisplay').textContent = campaigns[0].name;
        
        const players = await supabaseQuery('players', 'GET', null, `?campaign_id=eq.${campaignId}&order=created_at.desc`);
        
        const playersList = document.getElementById('playersList');

        // team share raised per player
        const cards = await supabaseQuery('cards', 'GET', null, `?campaign_id=eq.${campaignId}&select=player_id,team_amount`);
        const raisedBy = {};
        let campaignRaised = 0;
        let teamPageRaised = 0;
        let teamPageCards = 0;
        (cards || []).forEach(c => {
          campaignRaised += Number(c.team_amount || 0);
          if (!c.player_id) {
            // Bought from the team link — belongs to the team, not a player.
            teamPageRaised += Number(c.team_amount || 0);
            teamPageCards++;
            return;
          }
          raisedBy[c.player_id] = (raisedBy[c.player_id] || 0) + Number(c.team_amount || 0);
        });

        // what the team has been paid so far
        const paidRows = await supabaseQuery('payouts', 'GET', null,
          `?campaign_id=eq.${campaignId}&select=amount,paid_on,method,reference&order=paid_on.desc`);
        const paidTotal = (paidRows || []).reduce((sum, r) => sum + Number(r.amount || 0), 0);

        const earnBox = document.getElementById('coachEarnings');
        if (earnBox) {
          earnBox.innerHTML = `
            <button class="btn" onclick="copyTeamLink('${campaigns[0].slug}')" style="width:100%;margin-bottom:12px;">${t('teamLink')}</button>
            <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;">
              <div style="padding:14px;background:#ffffff08;border-radius:12px;border:1px solid #ffffff14;">
                <p style="margin:0;font-size:12px;color:#aaa;">${t('teamShareTotal')}</p>
                <p style="margin:6px 0 0 0;font-size:24px;font-weight:950;color:var(--gold);">${money(campaignRaised)}</p>
              </div>
              <div style="padding:14px;background:#ffffff08;border-radius:12px;border:1px solid #ffffff14;">
                <p style="margin:0;font-size:12px;color:#aaa;">${t('paidOut')}</p>
                <p style="margin:6px 0 0 0;font-size:24px;font-weight:950;">${money(paidTotal)}</p>
              </div>
              <div style="padding:14px;background:#ffffff08;border-radius:12px;border:1px solid #ffffff14;">
                <p style="margin:0;font-size:12px;color:#aaa;">${t('outstanding')}</p>
                <p style="margin:6px 0 0 0;font-size:24px;font-weight:950;">${money(campaignRaised - paidTotal)}</p>
              </div>
            </div>
            ${(paidRows || []).length ? `<div style="margin-top:12px;">` + paidRows.map(r => `
              <div style="padding:9px;background:#0e0a11;border-radius:6px;margin:5px 0;font-size:12px;color:#aaa;">
                <strong style="color:var(--gold);">${money(r.amount)}</strong> · ${r.paid_on}${r.method ? ' · ' + r.method : ''}${r.reference ? ' · ' + r.reference : ''}
              </div>`).join('') + `</div>` : ''}`;
        }
        
        const teamPageRow = teamPageRaised > 0 ? `
          <div style="padding:10px;background:#1a1420;border-radius:9px;margin:5px 0;display:flex;justify-content:space-between;align-items:center;gap:8px;border:1px solid #ffffff1a;">
            <div>
              <span>${t('teamPageSales')}</span>
              <span style="color:#888;font-size:11px;margin-left:6px;">${teamPageCards} ${t('cardsPlural')}</span>
            </div>
            <span style="color:var(--gold);font-weight:950;">${money(teamPageRaised)}</span>
          </div>` : '';

        const rosterRows = (!players || players.length === 0)
          ? `<p style="color:#aaa;">${t('noPlayers')}</p>`
          : players.map((p) => `
          <div style="padding:10px;background:#0e0a11;border-radius:9px;margin:5px 0;display:flex;justify-content:space-between;align-items:center;gap:8px;">
            <div>
              <span>${p.name}</span>
              <span style="color:var(--gold);font-weight:950;margin-left:8px;">${money(raisedBy[p.id] || 0)}</span>
            </div>
            <span style="display:flex;gap:6px;flex-shrink:0;">
              <button class="btn" onclick="copyPlayerLink('${p.id}')" style="padding:5px 10px;font-size:11px;">${t('copyLink')}</button>
              <button class="btn alt" onclick="removePlayer('${p.id}')" style="padding:5px 10px;font-size:11px;">${t('remove')}</button>
            </span>
          </div>
        `).join('');

        playersList.innerHTML = teamPageRow + rosterRows;
      } catch (error) {
        console.error('Error:', error);
      }
    }

    function copyPlayerLink(playerId) {

          .then(() => alert('Player link copied:\n\n' + link))
          .catch(() => prompt('Copy this link:', link));

      }

      try {
        const rows = await supabaseQuery('merchants', 'GET', null, `?access_code=eq.${encodeURIComponent(code)}`);

        loadMerchantDashboard();
      } catch (error) {
        alert('Error: ' + error.message);
      }
    }

    async function loadMerchantDashboard() {
      const merchantId = sessionStorage.getItem('currentMerchantId');
      if (!merchantId) return;

      try {
        const rows = await supabaseQuery('merchants', 'GET', null, `?id=eq.${merchantId}`);
        if (!rows || rows.length === 0) return;
        const merchant = rows[0];

        const nameEl = document.getElementById('merchantNameDisplay');
        if (nameEl) nameEl.textContent = merchant.name;

        const designs = await supabaseQuery('card_designs', 'GET', null,
          `?merchant_id=eq.${merchantId}&select=id,name,tab_count`);

        const box = document.getElementById('merchantStats');
        if (!designs || designs.length === 0) {
          box.innerHTML = `<p style="color:#aaa;">${t('noMerchantCards')}</p>`;
          return;
        }

        const ids = designs.map(d => d.id).join(',');
        const cards = await supabaseQuery('cards', 'GET', null,
          `?design_id=in.(${ids})&select=id,card_tabs(status)`);
        const list = cards || [];

        let sealed = 0, peeled = 0, redeemed = 0;
        list.forEach(c => (c.card_tabs || []).forEach(tab => {
          if (tab.status === 'sealed') sealed++;
          else if (tab.status === 'peeled') peeled++;
          else if (tab.status === 'redeemed') redeemed++;
        }));

        const totalTabs = sealed + peeled + redeemed;
        const rate = totalTabs ? Math.round((redeemed / totalTabs) * 100) : 0;

        box.innerHTML = `
          <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;">
            <div style="padding:14px;background:#ffffff08;border-radius:12px;border:1px solid #ffffff14;">
              <p style="margin:0;font-size:12px;color:#aaa;">${t('cardsInCirculation')}</p>
              <p style="margin:6px 0 0 0;font-size:26px;font-weight:950;color:var(--gold);">${list.length}</p>
            </div>
            <div style="padding:14px;background:#ffffff08;border-radius:12px;border:1px solid #ffffff14;">
              <p style="margin:0;font-size:12px;color:#aaa;">${t('couponsRedeemed')}</p>
              <p style="margin:6px 0 0 0;font-size:26px;font-weight:950;color:var(--gold);">${redeemed}</p>
            </div>
            <div style="padding:14px;background:#ffffff08;border-radius:12px;border:1px solid #ffffff14;">
              <p style="margin:0;font-size:12px;color:#aaa;">${t('couponsPeeled')}</p>
              <p style="margin:6px 0 0 0;font-size:26px;font-weight:950;">${peeled}</p>
            </div>
            <div style="padding:14px;background:#ffffff08;border-radius:12px;border:1px solid #ffffff14;">
              <p style="margin:0;font-size:12px;color:#aaa;">${t('redemptionRate')}</p>
              <p style="margin:6px 0 0 0;font-size:26px;font-weight:950;">${rate}%</p>
            </div>
          </div>
          <p style="margin:14px 0 0 0;font-size:12px;color:#888;">${t('unusedCoupons')}: ${sealed}</p>`;
      } catch (error) {

    async function merchantLookup() {
      const merchantId = sessionStorage.getItem('currentMerchantId');
      const code = (document.getElementById('lookupCode').value || '').trim().toUpperCase();
      const box = document.getElementById('lookupResult');
      if (!code) return;

      box.innerHTML = `<p style="color:#aaa;">${t('loading')}</p>`;

      try {
        const cards = await supabaseQuery('cards', 'GET', null,
          `?card_token=eq.${encodeURIComponent(code)}&select=*,card_designs(name,offer_text,merchant_id),card_tabs(id,tab_number,status)`);

        if (!cards || cards.length === 0) {
          box.innerHTML = `<p style="color:#f66;">${t('cardNotFound')}</p>`;
          return;
        }

        const card = cards[0];
        // A merchant may only touch cards carrying their own offer.
        if (!card.card_designs || card.card_designs.merchant_id !== merchantId) {
          box.innerHTML = `<p style="color:#f66;">${t('notYourCard')}</p>`;
          return;

    // ===== BUY (Stripe Checkout) =====

    async function buyCard(designId, campaignId, playerId) {
      const buyerName = prompt(t('buyerPrompt'), '');
      if (buyerName === null) return;

      const qtyRaw = prompt(t('quantityPrompt'), '1');
      if (qtyRaw === null) return;
      const quantity = Math.min(Math.max(parseInt(qtyRaw, 10) || 1, 1), 20);

      const base = window.location.origin + window.location.pathname;

      try {
        const res = await fetch(`${PAYMENT_SERVER}/create-checkout-session`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            design_id: designId,
            campaign_id: campaignId,
            player_id: playerId,
            buyer_name: buyerName || t('supporterWord'),
            quantity: quantity,
            success_url: `${base}?player=${playerId}&purchase=success`,
            cancel_url: `${base}?player=${playerId}&purchase=cancelled`
          })
        });

        const data = await res.json();
        if (!res.ok || !data.url) throw new Error(data.error || 'Could not start checkout');

        window.location.href = data.url;
      } catch (error) {
        console.error('Checkout error:', error);
        alert('Could not start checkout: ' + error.message);
      }
    }

      }
    }

    // After checkout, wait for the webhook to create the card, then open it
    async function waitForNewCard(sessionId, tries = 15) {
      whenReady('supporterContent', async (box) => {
        box.innerHTML = `<div class="panel"><h3>${t('paymentReceived')}</h3><p style="color:#aaa;">${t('buildingCard')}</p></div>`;
      });

      for (let i = 0; i < tries; i++) {
        try {
          const cards = await supabaseQuery('cards', 'GET', null,
            `?stripe_session_id=eq.${sessionId}&select=card_token&order=card_index.asc`);
          if (cards && cards.length > 0 && cards[0].card_token) {
            // Several cards bought: list them all rather than opening one.
            if (cards.length > 1) {
              whenReady('supporterContent', (b) => {
                b.innerHTML = `
                  <div class="panel">
                    <h3>${t('paymentReceived')}</h3>
                    <p style="color:#aaa;">${cards.length} ${t('cardsPlural')} — ${t('checkEmail')}</p>
                    <div style="margin-top:14px;">
                      ${cards.map((c, i) => `
                        <a href="?card=${c.card_token}" style="display:block;padding:12px;background:#0e0a11;border:1px solid #ffffff14;border-radius:9px;margin:8px 0;color:var(--gold);font-family:monospace;font-weight:950;text-decoration:none;">
                          ${i + 1}. ${c.card_token}
                        </a>`).join('')}
                    </div>
                  </div>`;
              });
              return;
            }
            window.location.href = window.location.origin + window.location.pathname + '?card=' + cards[0].card_token;
            return;
          }
        } catch (e) {
          console.error('Waiting for card:', e);
        }
        await new Promise(r => setTimeout(r, 2000));
      }

      whenReady('supporterContent', (box) => {
        box.innerHTML = `<div class="panel"><h3>${t('paymentReceived')}</h3><p style="color:#aaa;">${t('cardSlow')}</p></div>`;
      });
    }

    // ===== BUY (Stripe Checkout) =====

    async function buyCard(designId, campaignId, playerId) {
      const buyerName = prompt(t('buyerPrompt'), '');
      if (buyerName === null) return;

      const base = window.location.origin + window.location.pathname;

      try {
        const res = await fetch(`${PAYMENT_SERVER}/create-checkout-session`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            design_id: designId,
            campaign_id: campaignId,
            player_id: playerId,
            buyer_name: buyerName || t('supporterWord'),
            success_url: `${base}?purchase=success&session_id={CHECKOUT_SESSION_ID}`,
            cancel_url: `${base}?player=${playerId}&purchase=cancelled`
          })
        });

        const data = await res.json();
        if (!res.ok || !data.url) throw new Error(data.error || 'Could not start checkout');

        window.location.href = data.url;
      } catch (error) {
        console.error('Checkout error:', error);
        alert('Could not start checkout: ' + error.message);
      }
    }

    // ===== HERO STATS =====

    async function loadHeroStats() {
      try {
        const cards = await supabaseQuery('cards', 'GET', null, '?select=team_amount');
        const raised = (cards || []).reduce((sum, c) => sum + Number(c.team_amount || 0), 0);
        const el = document.getElementById('statRaised');
        if (el) el.textContent = money(raised);
      } catch (e) {
        console.error('Hero raised stat:', e);
      }

      try {
        const campaigns = await supabaseQuery('campaigns', 'GET', null, '?select=id');
        const el = document.getElementById('statCampaigns');
        if (el) el.textContent = (campaigns || []).length;
      } catch (e) {
        console.error('Hero campaign stat:', e);
      }
    }

    // ===== NAV =====

    function toggleNav(force) {
      const menu = document.getElementById('navMenu');
      const burger = document.getElementById('hamburger');
      if (!menu) return;
      const open = (typeof force === 'boolean') ? force : !menu.classList.contains('open');
      menu.classList.toggle('open', open);
      if (burger) burger.classList.toggle('open', open);
    }

    // Close after picking a tab, and when tapping outside the menu.
    document.addEventListener('click', function (e) {
      const menu = document.getElementById('navMenu');
      if (!menu || !menu.classList.contains('open')) return;
      if (e.target.closest && e.target.closest('.tab')) { toggleNav(false); return; }
      if (e.target.closest && (e.target.closest('#navMenu') || e.target.closest('#hamburger'))) return;
      toggleNav(false);
    });

    // ===== PAGE WIRING =====

    document.addEventListener('click', function (e) {
      const tab = e.target.closest ? e.target.closest('.tab') : null;
      if (!tab) return;
      const which = tab.getAttribute('data-tab');
      if (which === 'player') loadPlayerView();
      if (which === 'supporter') loadSupporterCard();
      if (which === 'admin') initAdmin();
      if (which === 'coach' && !sessionStorage.getItem('currentCampaignId')) initCoach();
      if (which === 'merchant' && sessionStorage.getItem('currentMerchantId')) {
        whenReady('merchantUnlockedContent', (el) => {
          document.getElementById('merchantLocked').style.display = 'none';
          el.style.display = 'block';
          loadMerchantDashboard();
        });
      }
    });

    document.addEventListener('DOMContentLoaded', function () {
      const params = new URLSearchParams(window.location.search);

      applyLang();
      initAdmin();
      initCoach();

      ['designPrice', 'designShare'].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.addEventListener('input', updateSplitPreview);
      });

      if (params.get('purchase') === 'cancelled') {
        alert(t('checkoutCancelled'));
      }

      // Coming back from Stripe: find the new card and open it
      if (params.get('purchase') === 'success' && params.get('session_id')) {
        if (typeof showTab === 'function') showTab('supporter');
        waitForNewCard(params.get('session_id'));
        return;
      }

      // Returning from a coach sign-in link
      if (params.get('signin') === 'coach') {
        if (typeof showTab === 'function') showTab('coach');
        initCoach();
        return;
      }

      if (getTeamSlugFromUrl()) {
        if (typeof showTab === 'function') showTab('team');
        loadTeamView();
        return;
      }

      if (getCardTokenFromUrl()) {
        if (typeof showTab === 'function') showTab('supporter');
        loadSupporterCard();
        return;
      }

      if (getPlayerIdFromUrl()) {
        if (typeof showTab === 'function') showTab('player');
        loadPlayerView();
      }
    });
  </script>
</body>
</html>
